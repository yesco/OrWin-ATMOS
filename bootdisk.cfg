MEMORY {
    # 1. The 256-byte DSK structural format wrapper
    HEADER: start = $0000, size = 256, file = %O, fill = yes, fillval = 0;
    
    # 2. Track 0, Side 0, Sector 1 (The 512-byte hardware boot payload)
    BOOTRAM: start = $B000, size = 512, file = %O, fill = yes, fillval = 0;
    
    # 3. THE CRITICAL FIX: Force the linker to pad out the entire rest of the floppy!
    # Total data size required = 2 * 80 * 17 * 512 = 1,392,640 bytes.
    # We already used 512 bytes for the boot sector, so we pad the remaining 1,392,128 bytes.
    PADDING: start = $0000, size = 1392128, file = %O, fill = yes, fillval = 0;
}

SEGMENTS {
    DSKHDR:   load = HEADER,  type = ro;
    BOOTCODE: load = BOOTRAM, type = ro;
    EMPTYPAD: load = PADDING, type = ro, optional = yes;
}
