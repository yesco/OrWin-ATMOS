# Minimal ORICDISK geometry for Microdisc boot test
# Header 256 + full disk data 2*80*17*512 = 1 392 640 → total file 1 392 896

MEMORY {
    HEADER:   start = $0000, size = 256,      file = %O, fill = yes;
    BOOT:     start = $0000, size = 512,      file = %O, fill = yes;   # T0S1
    PAD1:     start = $0000, size = 1024,     file = %O, fill = yes, fillval = 0; # T0S2+S3
    SYSMAP:   start = $0000, size = 512,      file = %O, fill = yes;   # T0S4
    REST:     start = $0000, size = 1390592,  file = %O, fill = yes, fillval = 0;
    # 1 392 640 - 512 - 1024 - 512 = 1 390 592
}

SEGMENTS {
    DSKHDR:   load = HEADER, type = ro;
    BOOTCODE: load = BOOT,   type = ro;
    SYSMAP:   load = SYSMAP, type = ro;
}
