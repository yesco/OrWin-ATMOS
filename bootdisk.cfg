MEMORY {
    # 1. 256-byte Oric disk descriptor header
    HEADER:  start = $0000, size = 256, file = %O, fill = yes, fillval = 0;
    
    # 2. Track 0, Sector 1 (512-byte Boot block)
    BOOTRAM: start = $B000, size = 512, file = %O, fill = yes, fillval = 0;
    
    # 3. Track 0, Sectors 2 and 3 (1024 bytes filled with standard $E5 format bytes)
    PAD_S23: start = $0000, size = 1024, file = %O, fill = yes, fillval = $E5;
    
    # 4. Track 0, Sector 4 (512-byte System Signature block)
    SYSRAM:  start = $0000, size = 512, file = %O, fill = yes, fillval = 0;
    
    # 5. The absolute remainder of the disk file (Sectors 5 to the end of the disk)
    # Total disk size = 256 + (2 * 80 * 17 * 512) = 1,392,896 bytes.
    # We have linked 256 + 512 + 1024 + 512 = 2,304 bytes so far.
    # Remainder size = 1,392,896 - 2,304 = 1,390,592 bytes.
    PADDING: start = $0000, size = 1390592, file = %O, fill = yes, fillval = $E5;
}

SEGMENTS {
    DSKHDR:   load = HEADER,  type = ro;
    BOOTCODE: load = BOOTRAM, type = ro;
    SYSMAP:   load = SYSRAM,  type = ro;
    EMPTYPAD: load = PADDING, type = ro, optional = yes;
}
